name: Sync Google Play apps

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-google-play.yml'
      - 'scripts/sync-google-play.mjs'

concurrency:
  group: sync-google-play
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts google-play-scraper@10.1.4
      - run: node scripts/sync-google-play.mjs
      - name: Save changed catalog
        run: |
          git add apps.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Google Play app catalog'
          git push origin HEAD:main
